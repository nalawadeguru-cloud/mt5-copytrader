<!DOCTYPE html>
<html>
<body>
    <h2>Secure Login</h2>
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
    <form action="/verify-pin" method="post">
        <input type="password" name="pin" placeholder="Enter PIN" required>
        <button type="submit">Login</button>
    </form>
</body>
</html>
