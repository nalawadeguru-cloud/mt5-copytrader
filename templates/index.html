<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <title>MT5 क्लाउड कॉपी ट्रेडर</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 30px; text-align: center; }
        .box { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select, button { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #27ae60; color: white; font-weight: bold; cursor: pointer; border: none; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #34495e; color: white; }
    </style>
</head>
<body>
<div class="box">
    <h2>📊 MT5 Copy Trading Web App</h2>
    <form action="/add-account" method="POST">
        <select name="user_type">
            <option value="master">Master Account (मास्टर)</option>
            <option value="follower">Follower Account (फॉलोअर)</option>
        </select>
        <input type="text" name="metaapi_account_id" placeholder="MetaAPI Account ID" required>
        <input type="number" name="multiplier" step="0.1" value="1.0" placeholder="Multiplier" required>
        <button type="submit">अकाऊंट जोडा</button>
    </form>
    <h3>🖥️ जोडलेली अकाऊंट्स</h3>
    <table>
        <tr><th>Type</th><th>MetaAPI ID</th><th>Risk</th></tr>
        {% for account in accounts %}
        <tr><td>{{ account[1].upper() }}</td><td>{{ account[2] }}</td><td>{{ account[3] }}x</td></tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
